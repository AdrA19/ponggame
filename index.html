<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <style>
        .media-content {
            display: none;
        }

        .media-content.show {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
            position: relative;
        }

        #toggleBtn {
            opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            cursor: default;
            z-index: 9999;
        }

        .media-wrapper {
            position: relative;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            cursor: move;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: inline-block;
        }

        .media-wrapper video, 
        .media-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
            pointer-events: none; 
        }

        .media-wrapper.initialized video,
        .media-wrapper.initialized img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            background: #555;
            cursor: se-resize;
            border-top-left-radius: 4px;
            z-index: 101;
            transition: background 0.2s;
        }

        .resize-handle:hover {
            background: #888;
        }
    </style>
</head>
<body>

    <button id="toggleBtn"></button>
    <div id="mediaContainer" class="media-content"></div>

    <script>
        const btn = document.getElementById('toggleBtn');
        const container = document.getElementById('mediaContainer');

        const mediaSources = [
            "./videos/42920891a.mp4",
            "./videos/1.mp4",
            "./videos/2.mp4",
            "./videos/3.mp4",
            "./videos/4.mp4",
            "./videos/5.mp4",
            "./videos/gif.mp4",
            "./videos/26037237.gif"
        ];

        mediaSources.forEach((src) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';
            
            let htmlContent = src.endsWith('.mp4')
                ? `<video autoplay loop muted playsinline><source src="${src}" type="video/mp4"></video>`
                : `<img src="${src}" alt="Media Content">`;
            
            wrapper.innerHTML = htmlContent + '<div class="resize-handle"></div>';
            
            container.appendChild(wrapper);
            initInteract(wrapper);
        });

        btn.addEventListener('click', () => {
            container.classList.toggle('show');
        });

        function makeAbsolute(element) {
            if (element.style.position === 'absolute') return;

            const rect = element.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            element.style.width = rect.width + 'px';
            element.style.height = rect.height + 'px';
            element.style.left = (rect.left - containerRect.left) + 'px';
            element.style.top = (rect.top - containerRect.top) + 'px';
            element.style.position = 'absolute';
            element.classList.add('initialized');
        }

        function initInteract(element) {
            const handle = element.querySelector('.resize-handle');
            let startX, startY, startWidth, startHeight, startLeft, startTop;

            element.addEventListener('mousedown', (e) => {
                if (e.target === handle) return;
                e.preventDefault();
                
                makeAbsolute(element);

                document.querySelectorAll('.media-wrapper').forEach(w => w.style.zIndex = '1');
                element.style.zIndex = '100';

                startX = e.clientX;
                startY = e.clientY;
                startLeft = element.offsetLeft;
                startTop = element.offsetTop;

                function doDrag(mEvent) {
                    element.style.left = (startLeft + mEvent.clientX - startX) + 'px';
                    element.style.top = (startTop + mEvent.clientY - startY) + 'px';
                }

                function stopDrag() {
                    document.removeEventListener('mousemove', doDrag);
                    document.removeEventListener('mouseup', stopDrag);
                }

                document.addEventListener('mousemove', doDrag);
                document.addEventListener('mouseup', stopDrag);
            });

            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();

                makeAbsolute(element);

                document.querySelectorAll('.media-wrapper').forEach(w => w.style.zIndex = '1');
                element.style.zIndex = '100';

                startX = e.clientX;
                startY = e.clientY;
                startWidth = element.offsetWidth;
                startHeight = element.offsetHeight;

                const aspectRatio = startWidth / startHeight;

                function doResize(mEvent) {
                    let newWidth = startWidth + (mEvent.clientX - startX);
                    
                    if (newWidth < 50) newWidth = 50;

                    let newHeight = newWidth / aspectRatio;

                    element.style.width = newWidth + 'px';
                    element.style.height = newHeight + 'px';
                }

                function stopResize() {
                    document.removeEventListener('mousemove', doResize);
                    document.removeEventListener('mouseup', stopResize);
                }

                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', stopResize);
            });
        }
    </script>
</body>
</html>
