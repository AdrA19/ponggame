<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Top Bar - Hidden by default, shows only on hover */
        .top-bar {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.15s linear;
        }

        .top-bar:hover {
            opacity: 1;
        }

        .top-bar-btn {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .top-bar-btn:hover {
            background: #333;
            border-color: #888;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #1e1e1e;
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            border: 1px solid #444;
            border-radius: 6px;
            z-index: 10001;
            max-height: 250px;
            overflow-y: auto;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            color: #fff;
            padding: 8px 12px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background-color: #333;
        }

        .dropdown-item.restore-all {
            background-color: #2b3a4a;
            font-weight: bold;
            text-align: center;
            justify-content: center;
        }

        .dropdown-item.restore-all:hover {
            background-color: #3b4d61;
        }

        .media-content {
            display: none;
        }

        .media-content.show {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
            position: relative;
        }

        /* Top Left Corner Show/Hide Trigger */
        #toggleBtn {
            opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            cursor: default;
            z-index: 25000;
        }

        .media-wrapper {
            position: relative;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: inline-block;
        }

        .media-wrapper video, 
        .media-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
            pointer-events: auto; 
        }

        .media-wrapper.initialized video,
        .media-wrapper.initialized img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video Controls - Show ONLY on media wrapper hover */
        .controls-top-right {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 102;
            display: flex;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-in-out;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 102;
            background: rgba(220, 38, 38, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            width: 36px;
            height: 36px;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-in-out, background 0.2s;
            user-select: none;
        }

        .resize-handle {
            position: absolute;
            background: #777;
            border: 1px solid #111;
            z-index: 101;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-in-out, background 0.2s;
        }

        .media-wrapper:hover .controls-top-right,
        .media-wrapper:hover .delete-btn,
        .media-wrapper:hover .resize-handle {
            opacity: 1;
            pointer-events: auto;
        }

        .pip-btn, .sound-btn {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            user-select: none;
        }

        .pip-btn:hover, .sound-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            border-color: #fff;
        }

        .delete-btn:hover {
            background: rgba(185, 28, 28, 1);
            border-color: #fff;
        }

        .resize-handle:hover {
            background: #fff;
        }

        .resize-handle.nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
        .resize-handle.ne { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
        .resize-handle.sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: nesw-resize; }
        .resize-handle.se { bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; }

        .resize-handle.n { top: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 6px; cursor: ns-resize; }
        .resize-handle.s { bottom: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 6px; cursor: ns-resize; }
        .resize-handle.e { right: 0; top: 50%; transform: translateY(-50%); height: 20px; width: 6px; cursor: ew-resize; }
        .resize-handle.w { left: 0; top: 50%; transform: translateY(-50%); height: 20px; width: 6px; cursor: ew-resize; }

        /* Fullscreen Clean Iframe Modal (No buttons) */
        .iframe-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 20000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .iframe-modal.show {
            display: flex;
        }

        .iframe-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Top Bar Controls (Appears on Hover) -->
    <div class="top-bar">
        <button id="gifreelsBtn" class="top-bar-btn">GifReels</button>
        <button id="hardgifBtn" class="top-bar-btn">HardGif</button>
        <button id="muteAllBtn" class="top-bar-btn">Mute All</button>
        <div class="dropdown">
            <button id="restoreDropdownBtn" class="top-bar-btn">Restore (0)</button>
            <div id="restoreMenu" class="dropdown-menu">
                <div id="restoreAllOption" class="dropdown-item restore-all">Restore All</div>
                <div id="deletedList"></div>
            </div>
        </div>
    </div>

    <!-- Invisible Corner Trigger Button -->
    <button id="toggleBtn"></button>
    <div id="mediaContainer" class="media-content"></div>

    <!-- Clean Fullscreen Iframe Modal -->
    <div id="iframeModal" class="iframe-modal">
        <div class="iframe-container">
            <iframe id="activeIframe" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        const btn = document.getElementById('toggleBtn');
        const container = document.getElementById('mediaContainer');
        const muteAllBtn = document.getElementById('muteAllBtn');
        const restoreDropdownBtn = document.getElementById('restoreDropdownBtn');
        const restoreMenu = document.getElementById('restoreMenu');
        const restoreAllOption = document.getElementById('restoreAllOption');
        const deletedList = document.getElementById('deletedList');

        const gifreelsBtn = document.getElementById('gifreelsBtn');
        const hardgifBtn = document.getElementById('hardgifBtn');
        const iframeModal = document.getElementById('iframeModal');
        const activeIframe = document.getElementById('activeIframe');

        const mediaSources = [
            "./videos/42920891a.mp4",
            "./videos/1.mp4",
            "./videos/2.mp4",
            "./videos/3.mp4",
            "./videos/4.mp4",
            "./videos/5.mp4",
            "./videos/26037237.gif",
            "./videos/11.mp4",
            "./videos/21.mp4",
            "./videos/34.mp4",
            "./videos/54.mp4",
            "./videos/324.mp4",
            "./videos/65.mp4"
        ];

        const deletedItems = [];

        mediaSources.forEach((src, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';
            wrapper.dataset.id = 'media-' + index;
            wrapper.dataset.filename = src.split('/').pop();
            
            const isVideo = src.endsWith('.mp4');
            let htmlContent = `<button class="delete-btn" title="Delete">&times;</button>`;
            
            if (isVideo) {
                htmlContent += `
                    <video autoplay loop muted playsinline><source src="${src}" type="video/mp4"></video>
                    <div class="controls-top-right">
                        <button class="sound-btn" title="Toggle Sound">🔇 Mute</button>
                        <button class="pip-btn" title="Picture in Picture">PiP</button>
                    </div>
                `;
            } else {
                htmlContent += `<img src="${src}" alt="Media Content">`;
            }
            
            htmlContent += `
                <div class="resize-handle nw" data-dir="nw"></div>
                <div class="resize-handle ne" data-dir="ne"></div>
                <div class="resize-handle sw" data-dir="sw"></div>
                <div class="resize-handle se" data-dir="se"></div>
                <div class="resize-handle n" data-dir="n"></div>
                <div class="resize-handle s" data-dir="s"></div>
                <div class="resize-handle e" data-dir="e"></div>
                <div class="resize-handle w" data-dir="w"></div>
            `;
            
            wrapper.innerHTML = htmlContent;
            container.appendChild(wrapper);
            initInteract(wrapper);
        });

        /* Universal Panic Hide Function */
        function immediateHide() {
            container.classList.remove('show');
            iframeModal.classList.remove('show');
            activeIframe.src = '';
            muteAllVideos();
        }

        /* Corner Click Listener - Hides everything if open, or opens media container if closed */
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (container.classList.contains('show') || iframeModal.classList.contains('show')) {
                immediateHide();
            } else {
                container.classList.add('show');
            }
        });

        muteAllBtn.addEventListener('click', muteAllVideos);

        restoreDropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            restoreMenu.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!restoreMenu.contains(e.target) && e.target !== restoreDropdownBtn) {
                restoreMenu.classList.remove('show');
            }
        });

        restoreAllOption.addEventListener('click', () => {
            [...deletedItems].forEach(item => restoreItem(item.id));
            restoreMenu.classList.remove('show');
        });

        /* Instant Hide on Tab Switch / Window Unfocus / Focus Shift */
        window.addEventListener('blur', immediateHide, true);
        window.addEventListener('pagehide', immediateHide, true);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) immediateHide();
        }, true);

        /* Iframe Management */
        function openIframe(url) {
            muteAllVideos();
            container.classList.remove('show');
            activeIframe.src = url;
            iframeModal.classList.add('show');
        }

        gifreelsBtn.addEventListener('click', () => openIframe('https://gifreels.com'));
        hardgifBtn.addEventListener('click', () => openIframe('https://hardgif.com'));

        /* Click anywhere on Iframe Modal hides everything */
        iframeModal.addEventListener('click', () => {
            immediateHide();
        });

        function muteAllVideos() {
            document.querySelectorAll('.media-wrapper video').forEach(video => {
                video.muted = true;
            });
            document.querySelectorAll('.sound-btn').forEach(btn => {
                btn.textContent = '🔇 Mute';
            });
        }

        function deleteItem(wrapper) {
            const id = wrapper.dataset.id;
            const filename = wrapper.dataset.filename;

            const video = wrapper.querySelector('video');
            if (video) {
                video.muted = true;
                const soundBtn = wrapper.querySelector('.sound-btn');
                if (soundBtn) soundBtn.textContent = '🔇 Mute';
            }

            wrapper.style.display = 'none';
            deletedItems.push({ id, filename, element: wrapper });
            updateRestoreMenu();
        }

        function restoreItem(id) {
            const index = deletedItems.findIndex(item => item.id === id);
            if (index !== -1) {
                const item = deletedItems.splice(index, 1)[0];
                item.element.style.display = '';
                updateRestoreMenu();
            }
        }

        function updateRestoreMenu() {
            restoreDropdownBtn.textContent = `Restore (${deletedItems.length})`;
            deletedList.innerHTML = '';

            if (deletedItems.length === 0) {
                restoreAllOption.style.display = 'none';
            } else {
                restoreAllOption.style.display = 'flex';
                deletedItems.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'dropdown-item';
                    row.innerHTML = `<span>${item.filename}</span> <span>➕</span>`;
                    row.addEventListener('click', () => restoreItem(item.id));
                    deletedList.appendChild(row);
                });
            }
        }

        function makeAbsolute(element) {
            if (element.style.position === 'absolute') return;

            const rect = element.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            element.style.width = rect.width + 'px';
            element.style.height = rect.height + 'px';
            element.style.left = (rect.left - containerRect.left) + 'px';
            element.style.top = (rect.top - containerRect.top) + 'px';
            element.style.position = 'absolute';
            element.classList.add('initialized');
        }

        function initInteract(element) {
            /* Clicking anywhere on a video/media item immediately hides everything */
            element.addEventListener('click', (e) => {
                if (e.target.classList.contains('resize-handle') || 
                    e.target.classList.contains('pip-btn') || 
                    e.target.classList.contains('sound-btn') || 
                    e.target.classList.contains('delete-btn')) return;
                
                immediateHide();
            });

            const pipBtn = element.querySelector('.pip-btn');
            if (pipBtn) {
                pipBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const video = element.querySelector('video');
                    if (!video) return;
                    try {
                        if (document.pictureInPictureElement) {
                            await document.exitPictureInPicture();
                        } else {
                            await video.requestPictureInPicture();
                        }
                    } catch (err) {}
                });
            }

            const soundBtn = element.querySelector('.sound-btn');
            if (soundBtn) {
                soundBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const video = element.querySelector('video');
                    if (!video) return;
                    video.muted = !video.muted;
                    soundBtn.textContent = video.muted ? '🔇 Mute' : '🔊 Sound';
                });
            }

            const deleteBtn = element.querySelector('.delete-btn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteItem(element);
                });
            }

            element.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('resize-handle') || 
                    e.target.classList.contains('pip-btn') || 
                    e.target.classList.contains('sound-btn') || 
                    e.target.classList.contains('delete-btn')) return;
                
                makeAbsolute(element);

                document.querySelectorAll('.media-wrapper').forEach(w => w.style.zIndex = '1');
                element.style.zIndex = '100';

                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = element.offsetLeft;
                const startTop = element.offsetTop;

                function doDrag(mEvent) {
                    element.style.left = (startLeft + mEvent.clientX - startX) + 'px';
                    element.style.top = (startTop + mEvent.clientY - startY) + 'px';
                }

                function stopDrag() {
                    document.removeEventListener('mousemove', doDrag);
                    document.removeEventListener('mouseup', stopDrag);
                }

                document.addEventListener('mousemove', doDrag);
                document.addEventListener('mouseup', stopDrag);
            });

            const handles = element.querySelectorAll('.resize-handle');
            handles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    makeAbsolute(element);

                    document.querySelectorAll('.media-wrapper').forEach(w => w.style.zIndex = '1');
                    element.style.zIndex = '100';

                    const startX = e.clientX;
                    const startY = e.clientY;
                    const startWidth = element.offsetWidth;
                    const startHeight = element.offsetHeight;
                    const startLeft = element.offsetLeft;
                    const startTop = element.offsetTop;

                    const aspectRatio = startWidth / startHeight;
                    const dir = handle.dataset.dir;

                    function doResize(mEvent) {
                        const deltaX = mEvent.clientX - startX;
                        const deltaY = mEvent.clientY - startY;
                        let newWidth = startWidth;
                        let newHeight = startHeight;

                        if (dir === 'se' || dir === 'e') {
                            newWidth = Math.max(50, startWidth + deltaX);
                            newHeight = newWidth / aspectRatio;
                        } else if (dir === 'sw' || dir === 'w') {
                            newWidth = Math.max(50, startWidth - deltaX);
                            newHeight = newWidth / aspectRatio;
                            element.style.left = (startLeft + startWidth - newWidth) + 'px';
                        } else if (dir === 'ne') {
                            newWidth = Math.max(50, startWidth + deltaX);
                            newHeight = newWidth / aspectRatio;
                            element.style.top = (startTop + startHeight - newHeight) + 'px';
                        } else if (dir === 'nw') {
                            newWidth = Math.max(50, startWidth - deltaX);
                            newHeight = newWidth / aspectRatio;
                            element.style.left = (startLeft + startWidth - newWidth) + 'px';
                            element.style.top = (startTop + startHeight - newHeight) + 'px';
                        } else if (dir === 's') {
                            newHeight = Math.max(50 / aspectRatio, startHeight + deltaY);
                            newWidth = newHeight * aspectRatio;
                        } else if (dir === 'n') {
                            newHeight = Math.max(50 / aspectRatio, startHeight - deltaY);
                            newWidth = newHeight * aspectRatio;
                            element.style.top = (startTop + startHeight - newHeight) + 'px';
                        }

                        element.style.width = newWidth + 'px';
                        element.style.height = newHeight + 'px';
                    }

                    function stopResize() {
                        document.removeEventListener('mousemove', doResize);
                        document.removeEventListener('mouseup', stopResize);
                    }

                    document.addEventListener('mousemove', doResize);
                    document.addEventListener('mouseup', stopResize);
                });
            });
        }

        updateRestoreMenu();
    </script>
</body>
</html>
